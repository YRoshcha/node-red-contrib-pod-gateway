<script type="text/x-red" data-template-name="pod-gateway-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Production gateway">
    </div>
    <div class="form-row">
        <label for="node-config-input-url"><i class="fa fa-link"></i> WebSocket URL</label>
        <input type="text" id="node-config-input-url" placeholder="wss://gateway.example.com/ws">
        <div class="form-tips" style="width:70%; max-width:none; margin-left:100px; box-sizing:border-box; white-space:normal; overflow-wrap:anywhere">Use <code>ws://127.0.0.1:8080/ws</code> only when the POD and Gateway are in the same container. For separate containers use the Gateway service name, for example <code>ws://gateway:8080/ws</code>.</div>
    </div>
    <div class="form-row">
        <label for="node-config-input-podId"><i class="fa fa-cube"></i> POD ID</label>
        <input type="text" id="node-config-input-podId" placeholder="auto or POD_ID environment variable">
    </div>
    <div class="form-row">
        <label for="node-config-input-token"><i class="fa fa-lock"></i> Token</label>
        <input type="password" id="node-config-input-token">
    </div>
    <div class="form-row">
        <label for="node-config-input-connectTimeout"><i class="fa fa-clock-o"></i> Connect timeout (ms)</label>
        <input type="number" id="node-config-input-connectTimeout" min="1000">
    </div>
    <div class="form-row">
        <label for="node-config-input-reconnectInterval"><i class="fa fa-refresh"></i> Reconnect interval (ms)</label>
        <input type="number" id="node-config-input-reconnectInterval" min="100">
    </div>
    <div class="form-row">
        <label for="node-config-input-verboseLogging"><i class="fa fa-terminal"></i> Verbose console logging</label>
        <input type="checkbox" id="node-config-input-verboseLogging" style="width:auto">
        <div class="form-tips" style="width:70%; max-width:none; margin-left:100px; box-sizing:border-box; white-space:normal; overflow-wrap:anywhere">Development troubleshooting only. Logs WebSocket lifecycle and request ids, never payloads.</div>
    </div>
</script>

<script type="text/x-red" data-help-name="pod-gateway-config">
    <p>Shared connection to the central POD Gateway. Configure this once and reuse it from Gateway In, Gateway Out and Gateway Call nodes.</p>
    <p>The token is stored in Node-RED credentials. External API credentials are never stored in a flow.</p>
    <p>Redis belongs to the central gateway. Configure it in the separate <b>Gateway Server Config</b> node, not here.</p>
    <p>If all nodes show <b>disconnected</b>, first check that the URL points to the central Gateway container and that port 8080 is reachable.</p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('pod-gateway-config', {
        category: 'config',
        defaults: {
            name: { value: '' },
            url: { value: '', required: true },
            podId: { value: '' },
            connectTimeout: { value: 10000, validate: RED.validators.number() },
            reconnectInterval: { value: 3000, validate: RED.validators.number() },
            verboseLogging: { value: false }
        },
        credentials: {
            token: { type: 'password' }
        },
        label: function () { return this.name || this.url || 'Gateway Config' }
    })
</script>
