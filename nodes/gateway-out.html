<script type="text/x-red" data-template-name="gateway-out">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Readable node name">
    </div>
    <div class="form-row">
        <label for="node-input-gateway"><i class="fa fa-plug"></i> Gateway</label>
        <input type="text" id="node-input-gateway">
    </div>
    <div class="form-row">
        <label for="node-input-operation"><i class="fa fa-bolt"></i> Adapter / operation</label>
        <span style="display:inline-flex; align-items:center; gap:6px; width:calc(70% - 6px); vertical-align:middle; box-sizing:border-box">
            <input type="text" id="node-input-operation" placeholder="service/name" style="flex:1 1 auto; width:auto; min-width:0; box-sizing:border-box">
            <select id="pod-gateway-operation-picker" title="Available operations" style="flex:0 0 210px; width:210px; box-sizing:border-box">
                <option value="">Available operations...</option>
            </select>
        </span>
        <div class="form-tips" style="width:70%; max-width:none; margin-left:100px; box-sizing:border-box; white-space:normal; overflow-wrap:anywhere">Select a registered operation, or enter its <code>service/name</code> key manually when the gateway is not connected yet.</div>
    </div>
    <div class="form-row">
        <label for="node-input-priority"><i class="fa fa-sort-amount-asc"></i> Priority</label>
        <select id="node-input-priority">
            <option value="normal">Normal</option>
            <option value="bulk">Bulk</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-acceptTimeout"><i class="fa fa-clock-o"></i> Accept timeout (ms)</label>
        <input type="number" id="node-input-acceptTimeout" min="1">
    </div>
</script>

<script type="text/x-red" data-help-name="gateway-out">
    <p>Sends an asynchronous operation to the central gateway. The first output means the gateway accepted the task; the second output is a delivery error.</p>
    <p>Use Gateway In to receive a later result or event.</p>
    <p>Use the same optional <code>msg._request</code> contract as Gateway Call. Safe dynamic headers support templates such as <code>Bearer {{payload.accessToken}}</code>; protected credentials stay in the Gateway API Config. The accepted message keeps the input envelope; Gateway In forwards it with the eventual response status and body.</p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('gateway-out', {
        category: 'POD Gateway',
        color: '#d7e8f5',
        defaults: {
            name: { value: '' },
            gateway: { type: 'gateway-config', required: true },
            operation: { value: '', required: true },
            priority: { value: 'bulk' },
            acceptTimeout: { value: 10000, validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 2,
        icon: 'font-awesome/fa-exchange',
        align: 'right',
        label: function () { return this.name || this.operation || 'Gateway Out' },
        paletteLabel: 'Gateway Out',
        oneditprepare: function () {
            var operationInput = $('#node-input-operation');
            var operationPicker = $('#pod-gateway-operation-picker');
            var setPickerState = function (items, placeholder) {
                var current = String(operationInput.val() || '').trim();
                var seen = Object.create(null);
                operationPicker.empty();
                $('<option>').val('').text(placeholder || 'Available operations...').appendTo(operationPicker);
                (items || []).forEach(function (item) {
                    if (!item || !item.operation || seen[item.operation]) return;
                    seen[item.operation] = true;
                    var label = item.label || item.description;
                    $('<option>').val(item.operation).text(label ? label + ' — ' + item.operation : item.operation).appendTo(operationPicker);
                });
                if (current && !seen[current]) $('<option>').val(current).text(current + ' (current)').appendTo(operationPicker);
                operationPicker.prop('disabled', false).val(seen[current] ? current : '');
            };
            var load = function () {
                var gateway = $('#node-input-gateway').val();
                if (!gateway) {
                    setPickerState([], 'Select a gateway first...');
                    operationPicker.prop('disabled', true);
                    return;
                }
                operationPicker.prop('disabled', true).empty().append($('<option>').val('').text('Loading operations...'));
                $.getJSON('pod-gateway/capabilities/' + encodeURIComponent(gateway))
                    .done(function (items) { setPickerState(items, (items || []).length ? 'Select an available operation...' : 'No registered operations'); })
                    .fail(function () { setPickerState([], 'Unavailable — enter manually'); });
            };
            operationPicker.on('change', function () {
                if (this.value) operationInput.val(this.value).trigger('change');
            });
            $('#node-input-gateway').on('change', load);
            load();
        }
    })
</script>
